name: Release to CurseForge

# main에 올라올 때 LeelUI.toc의 버전을 읽어서, 그 버전 태그가 아직 없으면
# 태그를 만들고 CurseForge에 올려요. (직접 태그를 올려도 동작)
on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag from toc version
        id: tag
        if: github.ref_type == 'branch'
        run: |
          v=$(grep -m1 '^## Version:' LeelUI.toc | sed 's/## Version:[[:space:]]*//' | tr -d '\r[:space:]')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "tag $v already exists, skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git tag "$v"
            git push origin "$v"
            # 봇이 올린 태그로는 작업이 안 돌아서, 그 태그로 이 작업을 한 번 더 실행
            gh workflow run release.yml --ref "$v"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: BigWigsMods/packager@v2
        if: github.ref_type == 'tag'
